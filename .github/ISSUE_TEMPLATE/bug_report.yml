name: Bug report
description: Report a reproducible problem with the shell or demo.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example or demo URL/query parameters where possible.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or relevant logs, with sensitive information removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: For local builds, provide the commit hash.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS/device, viewport size, and Svelte version if known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Optional. For accessibility issues, include assistive technology and input method where relevant.
