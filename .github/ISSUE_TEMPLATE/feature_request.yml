name: Feature request
description: Suggest an improvement to the shared UI shell.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and the situation where it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result. Mockups or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any workarounds or whether this could live in a consuming app.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, related issues, or compatibility considerations.
