name: Release package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub only returns draft releases to callers with push access.
    # This job runs metadata scripts only, never npm ci or package code.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      notes-id: ${{ steps.notes.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Plan release
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {default: plan} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/plan-release.mjs`);
            await plan({github, context, core});
      - name: Preserve release notes
        if: steps.plan.outputs.version != ''
        id: notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ steps.plan.outputs.version }}
          path: /tmp/tendstead-release-notes.md
          if-no-files-found: error
          retention-days: 7
  build:
    name: Verify and pack release
    needs: plan
    if: needs.plan.outputs.version != ''
    timeout-minutes: 15
    outputs:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # GitHub mounts /github/home for another user; Firefox runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.notes-id }}
          merge-multiple: true
          path: /tmp
      - if: needs.plan.outputs.version != ''
        run: npm ci
      - name: Set artifact version
        if: needs.plan.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
      - name: Verify release
        if: needs.plan.outputs.version != ''
        run: npm run verify
      - name: Pack verified library
        if: needs.plan.outputs.version != ''
        run: npm pack --pack-destination /tmp
      - name: Preserve verified release inputs
        if: needs.plan.outputs.version != ''
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ needs.plan.outputs.version }}
          path: |
            /tmp/tendstead-ui-${{ needs.plan.outputs.version }}.tgz
            /tmp/tendstead-release-notes.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.repository == 'tendstead/ui' && github.ref == 'refs/heads/main' && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pinned npm CLI with OIDC support
        run: npm install --global npm@12.2.2 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Publish verified package and GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        with:
          script: |
            const {default: publish} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`);
            await publish({github, context, artifactDirectory: `${process.env.RUNNER_TEMP}/release`});
      # A successful run can finish a pending older release while main has
      # advanced. Queue one more scan; no-op scans do not dispatch again.
      - name: Process any remaining merged PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: 'main'
            });
